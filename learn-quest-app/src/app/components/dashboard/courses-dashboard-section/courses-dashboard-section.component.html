<div class="container-fluid d-flex flex-wrap justify-content-center">
  <app-course class="m-3" *ngFor="let course of getCourses()" [course]="course" [href]="getCourseRoute()" [lite]="true"></app-course>
</div>
<div class="card-footer buttons">
  @for (button of getBottomButtons(); track button.routerLink) {
    <app-footer-button [icon]="button.icon" (click)="navigate(button.routerLink)"></app-footer-button>
  }
</div>
