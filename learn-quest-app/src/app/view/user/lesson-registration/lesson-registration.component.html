<div *ngFor="let section of lessonSections" class="section">
  <div *ngIf="section.type === 'text'" class="content">
    <div [innerHtml]="section.content"></div>
  </div>
  <div *ngIf="section.type === 'module'" class="module">
    <app-module-host *ngIf="section.moduleSlug"
      [slug]="section.moduleSlug"
      [config]="section.moduleConfig"
      (configChange)="onWidgetConfigChange(section, $event)">
    </app-module-host>
  </div>
  <div *ngIf="section.type === 'question'">
    <p>Question type not implemented yet</p>
  </div>
</div>
