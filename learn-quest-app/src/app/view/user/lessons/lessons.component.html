<div class="header position-relative" [style]="'--primary-color: ' + getCourse().primaryColor + ';'">
  @if (isTeacher()) {
    <button class="btn btn-icon position-absolute top-0 start-0" (click)="toggleEditing()">
      <app-icon [faIcon]="'pencil'" [color]="'white'"></app-icon>
    </button>
  }
  @if (isEditing()) {
    <button class="btn btn-icon position-absolute top-0 end-0" (click)="confirmDelete()">
      <app-icon [faIcon]="'trash'" [class]="'text-color-1'"></app-icon>
    </button>
    <div class="edit-row">
      <input class="w-90 mx-auto text-center glass" (blur)="saveCourseColor($event)" [value]="getCourse().primaryColor" type="color" />
      <app-icon-selector class="w-90 mx-auto" [value]="getCourse().faIcon" (valueChange)="saveCourseIcon($event)" [btnClass]="'glass'" [showLabel]="false"></app-icon-selector>
      <input class="w-90 mx-auto text-center glass" (blur)="saveCourseName($event)" [value]="getCourse().name" />
    </div>
  } @else {
    <app-icon [faIcon]="getCourse().faIcon" [color]="'white'"></app-icon>
    <h1>{{ getCourse().name }}</h1>
  }
</div>
<table class="table table-striped">
  <tr *ngFor="let lesson of getLessons()" [style]="'--primary-color: ' + getCourse().primaryColor">
    <td [style]="'--primary-color: ' + getCourse().primaryColor + ';'">
      <app-icon [faIcon]="lesson.faIcon" [color]="'white'"></app-icon>
    </td>
    <td>
      <h3>{{ lesson.name }}</h3>
    </td>
    <app-side-button
      [icon]="faArrowRight"
      [btnClass]="'right'"
      (click)="navigateToLesson(lesson.id)"
    ></app-side-button>
  </tr>
</table>
<div *ngIf="showEnrollNotification" class="alert alert-success mt-3">
  Enrolled successfully! Go to
  <a routerLink="/user/dashboard" class="alert-link">your dashboard</a>.
</div>
<app-footer-button *ngIf="isUser()" [text]="isEnrolled() ? 'Enrolled' : 'Enroll'"
                   [btnClass]="isEnrolled() ? 'btn-success' : 'btn-primary'"
                   [disabled]="isEnrolled()"
                   (click)="enroll()"></app-footer-button>
<app-footer-button *ngIf="isTeacher()" [text]="'Create Lesson'"
                   [btnClass]="'btn-2'"
                   (click)="navigateToCreateLesson()"></app-footer-button>
