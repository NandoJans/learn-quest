<div class="lib">
  <div class="module-selector">
    <input placeholder="Zoek module…" [formControl]="search" />
    <ul>
      <li *ngFor="let m of filtered(); trackBy: track"
          [class.sel]="m.slug===selectedSlug()"
          (click)="select(m)">
        <div class="title">{{m.title}}</div>
        <div class="desc">{{m.description}}</div>
        <div class="tags">
          <span *ngFor="let t of m.tags">{{t}}</span>
        </div>
      </li>
    </ul>
  </div>

  <div class="module-details" *ngIf="selected() as sel">
    <header>
      <h3>{{sel.title}}</h3>
    </header>

    <div class="two">
      <div class="pane config-pane">
        <div class="pane-header">
          <h4>Configuratie</h4>
        </div>
        <div class="config-form-container">
          <app-module-config-form
            [config]="config()"
            (configChange)="onConfigChange($event)">
          </app-module-config-form>
        </div>
      </div>

      <div class="pane">
        <div class="pane-header">
          <h4>Interactieve module</h4>
        </div>
        <div class="module-preview-container">
          <app-module-host
            [slug]="sel.slug"
            [config]="config()"
            (configChange)="onConfigChange($event)">
          </app-module-host>
        </div>
      </div>
    </div>

    <div class="action-button-container">
      <button class="primary use-this-button" (click)="confirm()">Use this</button>
    </div>
  </div>
</div>
