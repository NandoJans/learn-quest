<div class="sections-wrapper">
  <form [formGroup]="sectionsForm" novalidate>
    <div
      formArrayName="sections"
      cdkDropList
      [cdkDropListData]="sections.controls"
      cdkDropListOrientation="vertical"
      (cdkDropListDropped)="dropSection($event)"
      class="sections-drop-list accordion"
    >
      <div
        class="section-card accordion-item"
        *ngFor="let section of sections.controls; index as i; trackBy: trackByPosition"
        [formGroupName]="i"
        [id]="section.get('id')?.value"
        cdkDrag
      >

        <header class="sec-header accordion-header">
          <button
            type="button"
            class="accordion-button"
            [attr.data-bs-toggle]="'collapse'"
            [attr.data-bs-target]="'#'+getSectionElementId(section)"
            aria-expanded="true"
            aria-controls="panelsStayOpen-collapseOne"
            aria-label="Open or close"
            (click)="setSectionOpen($event)"
          >
            <div class="accordion-button-body">
              <button type="button" class="drag-handle" cdkDragHandle aria-label="Drag to reorder">⠿</button>
              <h2 class="section-title">Section {{ i + 1 }}</h2>

              <div class="type-row" (click)="$event.stopPropagation()">
                <input type="radio" class="btn-check btn-3" id="textTypeOption-{{i}}" formControlName="type" value="text" />
                <label class="btn btn-3 btn-header" for="textTypeOption-{{i}}">Text</label>

                <input type="radio" class="btn-check btn-3" id="moduleTypeOption-{{i}}" formControlName="type" value="module" />
                <label class="btn btn-3 btn-header" for="moduleTypeOption-{{i}}">Interactive</label>

                <input type="radio" class="btn-check btn-3" id="questionTypeOption-{{i}}" formControlName="type" value="question" />
                <label class="btn btn-3 btn-header" for="questionTypeOption-{{i}}">Question</label>
              </div>
            </div>
          </button>
        </header>

        <!-- TEXT TYPE -->
        <section class="accordion-collapse collapse show" *ngIf="section.get('type')?.value === 'text'" [id]="getSectionElementId(section)">
          <div class="sec-body accordion-body">
            <label class="field">
              <span class="label">Explanation (HTML)</span>
              <app-html-field
                formControlName="content"
                [attr.data-section-index]="i"
                [attr.id]="'html-editor-' + i"
              >
              </app-html-field>
            </label>
          </div>
        </section>

        <!-- Module TYPE -->
        <section class="accordion-collapse collapse show" *ngIf="section.get('type')?.value === 'module'" [id]="getSectionElementId(section)">
          <div class="sec-body accordion-body">
            <div class="row">
              <label class="field">
                <span class="label">Module</span>
  <!--              Display selected module-->
                <div class="selected-module" *ngIf="section.get('moduleSlug')?.value;">
                  <strong>{{ section.get('moduleSlug')?.value }}</strong>
                </div>
                <div class="no-module" *ngIf="!section.get('moduleSlug')?.value;">
                  No module selected
                </div>
              </label>

              <button type="button" class="btn btn-2" (click)="openModuleLibraryFor(i)">
                Choose from module library
              </button>
            </div>

            <div class="module-preview-container mt-2">
              <app-module-host
                *ngIf="section.get('moduleSlug')?.value"
                [slug]="section.get('moduleSlug')?.value"
                [config]="section.get('moduleConfig')?.value"
                (configChange)="section.patchValue({ moduleConfig: $event }, { emitEvent: false })">
              </app-module-host>
            </div>

            <div class="config-form-container" *ngIf="section.get('moduleSlug')?.value">
            <h4 class="config-section-title">Module Configuration</h4>
            <app-module-config-form
              [config]="section.get('moduleConfig')?.value || {}"
              (configChange)="section.patchValue({ moduleConfig: $event }, { emitEvent: false })">
            </app-module-config-form>

            <details class="json-details">
              <summary>Advanced: Edit JSON directly</summary>
              <textarea
                rows="6"
                class="input mono"
                [value]="section.get('moduleConfig')?.value | json"
                (input)="section.patchValue({ moduleConfig: parseJsonSafe(getEncodedJson($event.target)) })"
                placeholder='{"min":0,"max":10,"operations":["+","-"]}'></textarea>
            </details>
          </div>
          </div>
        </section>

        <!-- QUESTION TYPE -->
        <section class="accordion-collapse collapse show" *ngIf="section.get('type')?.value === 'question'" [id]="getSectionElementId(section)">
          <div class="sec-body accordion-body">
            <label class="field">
              <span class="label">Prompt</span>
              <textarea class="input" rows="3" formControlName="questionPrompt" placeholder="Ask your question..."></textarea>
            </label>

            <div class="answers">
              <div class="answers-head">
                <span>Answers</span>
                <button type="button" class="btn subtle" (click)="addAnswer(i)">Add answer</button>
              </div>

              <div class="answer-row" *ngFor="let ans of answersArray(i).controls; index as j" [formGroup]="ans">
                <input
                  class="input"
                  type="text"
                  formControlName="text"
                  placeholder="Answer option" />

                <label class="chip">
                  <input
                    type="radio"
                    [value]="j"
                    [checked]="section.get('correctIndex')?.value === j"
                    (change)="section.patchValue({ correctIndex: j })" />
                  <span>Correct</span>
                </label>

                <button type="button" class="btn btn-1" (click)="removeAnswer(i, j)" *ngIf="answersArray(i).length > 1">
                  Remove
                </button>
              </div>
            </div>

            <label class="field">
            <span class="label">Explanation (shown after answer)</span>
            <textarea class="input" rows="3" formControlName="explanation" placeholder="Explain the correct answer..."></textarea>
          </label>
          </div>
        </section>

        <footer class="sec-footer">
          <span class="muted">{{ (autosaving) ? 'Autosaving' : 'Autosaved' }}</span>
          <button type="button" class="btn btn-1" (click)="removeSection(i)">Delete section</button>
        </footer>
        <hr class="divider"/>
      </div>
    </div>
  </form>

  <div class="text-center mt-3">
    <button class="btn btn-2" (click)="addSection()">Add section</button>
  </div>
</div>
